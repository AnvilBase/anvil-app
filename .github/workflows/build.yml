name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both apps
    runs-on: macos-26
    env:
      # LiteRT-LM keeps Android binaries in Git LFS and one object is missing upstream. iOS needs
      # none of them: the framework arrives as a release zip.
      GIT_LFS_SKIP_SMUDGE: 1
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: xcodebuild -version

      - name: Check App Store assets
        run: python3 Scripts/check-app-store.py

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AnvilAI.xcodeproj \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build AnvilAI
        run: |
          xcodebuild build \
            -project AnvilAI.xcodeproj \
            -scheme AnvilAI \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Build AnvilAIDev
        run: |
          xcodebuild build \
            -project AnvilAI.xcodeproj \
            -scheme AnvilAIDev \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Validate public release archive
        run: ./Scripts/app-store.sh validate
